[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmts"
version = "0.1.0"
description = "LLM research and testing system"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lmts = "lmts.cli:main"
lmts-tui = "lmts.view.tui:main"
lmts-view = "lmts.view.shell:main"
lmts-dvs = "lmts.dvs.server:main"

[tool.setuptools.packages.find]
include = ["lmts*"]

[tool.setuptools.package-data]
"lmts.config" = ["*.php"]
"lmts.install" = ["*.sh", "*.sql"]
"lmts.reporting" = ["*.json"]
"lmts.dvs" = ["templates/*.json", "presets/*.json", "static/*", "README.md"]
